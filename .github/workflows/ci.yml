name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Display Node version
        run: node -v

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install and check dependencies
        run: |
          bun ci
          git diff --exit-code

      - name: Lint
        run: bun run lint

      - name: Spellcheck
        run: bun run spellcheck

      - name: Style check
        run: bun run prettier-check

      - name: Build
        run: bun run build
